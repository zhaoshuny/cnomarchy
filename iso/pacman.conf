# CNomarchy pacman.conf (最小稳定版)
# 只使用 Arch 官方源 + multilib，确保构建一定成功

[options]
Architecture = x86_64
ParallelDownloads = 10
Color
CheckSpace
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# ============================================================
# Arch 官方源 (构建时使用 mirrorlist)
# ============================================================
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# ============================================================
# multilib (32位库，Steam/Wine 必需)
# ============================================================
[multilib]
Include = /etc/pacman.d/mirrorlist

# ============================================================
# Omarchy 源 (暂不启用，等基础版本稳定后再加)
# 启用方法: 取消下面注释，并在 packages.x86_64 中取消 quickshell 等包的注释
# ============================================================
#[omarchy]
#Server = https://repo.omarchy.org/stable/os/x86_64
#SigLevel = Optional TrustAll
