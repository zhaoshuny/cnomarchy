<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- CNomarchy 中文字体配置 -->
<!-- 部署到 ~/.config/fontconfig/fonts.conf -->
<!-- 优先级: Noto Sans CJK SC > 思源黑体 > 文泉驿 > 系统默认 -->

<fontconfig>

    <!-- 中文无衬线字体（界面、网页） -->
    <match target="pattern">
        <test qual="any" name="family"><string>sans-serif</string></test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Sans CJK SC</string>
            <string>Source Han Sans SC</string>
            <string>WenQuanYi Zen Hei</string>
            <string>WenQuanYi Micro Hei</string>
        </edit>
    </match>

    <!-- 中文衬线字体（文档、阅读） -->
    <match target="pattern">
        <test qual="any" name="family"><string>serif</string></test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Serif CJK SC</string>
            <string>Source Han Serif SC</string>
            <string>WenQuanYi Zen Hei</string>
        </edit>
    </match>

    <!-- 等宽字体（终端、代码） -->
    <match target="pattern">
        <test qual="any" name="family"><string>monospace</string></test>
        <edit name="family" mode="prepend" binding="strong">
            <string>JetBrains Mono</string>
            <string>Fira Code</string>
            <string>Noto Sans Mono CJK SC</string>
            <string>Source Han Sans SC</string>
        </edit>
    </match>

    <!-- 常见 Windows 字体替代 -->
    <match target="pattern">
        <test qual="any" name="family"><string>Microsoft YaHei</string></test>
        <edit name="family" mode="assign" binding="strong">
            <string>Noto Sans CJK SC</string>
        </edit>
    </match>

    <match target="pattern">
        <test qual="any" name="family"><string>SimHei</string></test>
        <edit name="family" mode="assign" binding="strong">
            <string>Noto Sans CJK SC</string>
        </edit>
    </match>

    <match target="pattern">
        <test qual="any" name="family"><string>SimSun</string></test>
        <edit name="family" mode="assign" binding="strong">
            <string>Noto Serif CJK SC</string>
        </edit>
    </match>

    <match target="pattern">
        <test qual="any" name="family"><string>KaiTi</string></test>
        <edit name="family" mode="assign" binding="strong">
            <string>Noto Serif CJK SC</string>
        </edit>
    </match>

    <!-- 字体渲染优化 -->
    <match target="font">
        <edit name="antialias" mode="assign"><bool>true</bool></edit>
        <edit name="hinting" mode="assign"><bool>true</bool></edit>
        <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
        <edit name="rgba" mode="assign"><const>rgb</const></edit>
        <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
        <edit name="autohint" mode="assign"><bool>false</bool></edit>
    </match>

    <!-- 禁用位图字体（避免中文显示为方块） -->
    <rejectfont>
        <pattern>
            <patelt name="scalable"><bool>false</bool></patelt>
        </pattern>
    </rejectfont>

    <!-- 字体缓存目录 -->
    <dir>~/.fonts</dir>
    <dir>~/.local/share/fonts</dir>

</fontconfig>
